[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lottery"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# ── ruff ───────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (intentional in some cases)
    "SIM103", # negated-return pattern more readable for guard clauses
    "SIM108", # multi-line if/else clearer than inline ternary
]
exclude = ["__pycache__", ".git", ".claude", ".cursor", "venv", "env"]

[tool.ruff.lint.per-file-ignores]
"src/scripts/*.py" = ["E402"]                      # sys.path manipulation before imports
"src/lottery/scoring.py" = ["N806", "N803"]        # math notation (X, W matrices)
"src/lottery/interval_markov.py" = ["N806"]        # math notation
"src/scripts/regenerate_history_archives.py" = ["F821"]  # pd annotation with future annotations
"src/lottery/builders/_prediction.py" = ["C401"]  # set(generator) | {const} pattern is intentional
"src/lottery/web/routes_api.py" = ["C401"]         # set(generator) pattern is intentional

[tool.ruff.lint.isort]
known-first-party = ["lottery"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ── mypy ────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
exclude = ["tests/", "build/", "venv/", "env/"]

# ── pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
