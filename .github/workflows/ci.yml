name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate CSV data integrity
        run: |
          python3 -c "
          import csv, os, sys
          errors = []

          specs = {
              'dlt': {'file': 'data/processed/dlt_draws.csv', 'cols': ['lottery_type','period_id','front_1','front_2','front_3','front_4','front_5','back_1','back_2'], 'front_range': (1,35), 'back_range': (1,12)},
              'ssq': {'file': 'data/processed/ssq_draws.csv', 'cols': ['lottery_type','period_id','red_1','red_2','red_3','red_4','red_5','red_6','blue_1'], 'front_range': (1,33), 'back_range': (1,16)},
              'kl8': {'file': 'data/processed/kl8_draws.csv', 'cols': ['lottery_type','period_id'] + [f'num_{i}' for i in range(1,21)], 'front_range': (1,80), 'back_range': None},
              'pl5': {'file': 'data/processed/pl5_draws.csv', 'cols': ['lottery_type','period_id','d1','d2','d3','d4','d5'], 'front_range': (0,9), 'back_range': None},
              'qxc': {'file': 'data/processed/qxc_draws.csv', 'cols': ['lottery_type','period_id','d1','d2','d3','d4','d5','d6','special'], 'front_range': (0,9), 'back_range': (0,14)},
          }

          for name, spec in specs.items():
              path = spec['file']
              if not os.path.exists(path):
                  errors.append(f'{name}: file not found: {path}')
                  continue

              with open(path) as f:
                  reader = csv.DictReader(f)
                  rows = list(reader)

              if len(rows) == 0:
                  errors.append(f'{name}: empty CSV')
                  continue

              # check columns
              actual_cols = list(rows[0].keys())
              if actual_cols != spec['cols']:
                  errors.append(f'{name}: columns mismatch, expected {spec[\"cols\"]}, got {actual_cols}')

              # check period_id monotonic
              pids = [int(r['period_id']) for r in rows]
              for i in range(1, len(pids)):
                  if pids[i] <= pids[i-1]:
                      errors.append(f'{name}: period_id not strictly increasing at row {i}: {pids[i-1]} -> {pids[i]}')
                      break

              # check number ranges (sample first and last rows)
              import json
              print(f'{name}: {len(rows)} rows, {pids[0]} ~ {pids[-1]}')

          if errors:
              print('ERRORS:')
              for e in errors:
                  print(f'  - {e}')
              sys.exit(1)
          else:
              print('All data valid!')
          "
